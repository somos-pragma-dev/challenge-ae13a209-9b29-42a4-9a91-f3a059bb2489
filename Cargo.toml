[package]
name = "rust-actix-loan-api"
version = "1.0.0"
edition = "2021"
description = "REST API para gestión de préstamos con Rust y Actix Web"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rust-actix-loan-api"
path = "src/main.rs"

[dependencies]
actix-web = "4.4.0"
actix-rt = "4.0.0"
diesel = { version = "2.1.0", features = ["postgres", "r2d2", "chrono", "serde_json"] }
diesel_migrations = "2.1.0"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
validator = { version = "2.1.0", features = ["derive"] }
thiserror = "1.0.50"
anyhow = "1.0.75"
dotenv = "0.15.0"
tokio = { version = "1.35.0", features = ["full"] }
chrono = { version = "0.4.31", features = ["serde"] }
bcrypt = "0.15.0"
jsonwebtoken = "9.2.0"
r2d2 = "0.8.10"
r2d2_diesel = "1.0.0"
log = "0.4"
env_logger = "0.11.0"

[dev-dependencies]
actix-rt = "4.0.0"
actix-web = "4.4.0"

[features]
default = ["diesel/postgres"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1